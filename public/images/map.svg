<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized map showing the property location">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cc6cf"/>
      <stop offset="100%" stop-color="#7fb0bd"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="800" height="500" fill="#efe9df"/>

  <!-- River -->
  <path d="M0 120 C 140 90 220 180 360 200 C 500 220 560 150 700 190 L 800 210 L 800 280 C 640 250 560 330 420 310 C 280 290 200 210 0 230 Z" fill="url(#water)"/>

  <!-- Park -->
  <ellipse cx="170" cy="400" rx="120" ry="70" fill="#a7c89a" opacity="0.8"/>
  <ellipse cx="650" cy="120" rx="100" ry="55" fill="#a7c89a" opacity="0.8"/>

  <!-- Street grid -->
  <g stroke="#ffffff" stroke-width="10" fill="none">
    <line x1="60" y1="60" x2="760" y2="60"/>
    <line x1="60" y1="180" x2="740" y2="180"/>
    <line x1="60" y1="320" x2="760" y2="320"/>
    <line x1="60" y1="440" x2="760" y2="440"/>
    <line x1="90" y1="40" x2="90" y2="480"/>
    <line x1="230" y1="40" x2="230" y2="480"/>
    <line x1="380" y1="40" x2="380" y2="480"/>
    <line x1="530" y1="40" x2="530" y2="480"/>
    <line x1="680" y1="40" x2="680" y2="480"/>
  </g>

  <!-- Block shapes between streets -->
  <g fill="#e0d9ca">
    <rect x="100" y="70" width="120" height="100" rx="4"/>
    <rect x="240" y="70" width="130" height="100" rx="4"/>
    <rect x="390" y="70" width="130" height="100" rx="4"/>
    <rect x="540" y="70" width="130" height="100" rx="4"/>
    <rect x="100" y="190" width="120" height="120" rx="4"/>
    <rect x="240" y="190" width="130" height="120" rx="4"/>
    <rect x="540" y="190" width="130" height="120" rx="4"/>
    <rect x="100" y="330" width="120" height="100" rx="4"/>
    <rect x="240" y="330" width="130" height="100" rx="4"/>
    <rect x="390" y="330" width="130" height="100" rx="4"/>
    <rect x="540" y="330" width="130" height="100" rx="4"/>
    <rect x="100" y="440" width="120" height="40" rx="4"/>
  </g>

  <!-- Main avenue (gold) -->
  <line x1="380" y1="20" x2="380" y2="480" stroke="#c8a15a" stroke-width="6"/>

  <!-- Location pins -->
  <g>
    <!-- main pin -->
    <g transform="translate(580,240)">
      <circle cx="0" cy="0" r="16" fill="#c8a15a"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3" fill="#c8a15a"/>
      <path d="M0 16 L -8 34 L 0 30 L 8 34 Z" fill="#c8a15a"/>
    </g>
    <!-- secondary pin -->
    <g transform="translate(300,240)" opacity="0.85">
      <circle cx="0" cy="0" r="11" fill="#5f7285"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>
  </g>
</svg>
