<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Modern villa home glowing at evening">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a3a"/>
      <stop offset="62%" stop-color="#4c3f52"/>
      <stop offset="100%" stop-color="#c9895f"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22303a"/>
      <stop offset="100%" stop-color="#141c26"/>
    </linearGradient>
    <linearGradient id="houseBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232b33"/>
      <stop offset="100%" stop-color="#171c23"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Low warm sun -->
  <circle cx="560" cy="430" r="150" fill="#e9a968" opacity="0.22"/>
  <circle cx="560" cy="430" r="56" fill="#ffd9a0" opacity="0.85"/>

  <!-- Distant hills -->
  <ellipse cx="200" cy="470" rx="420" ry="120" fill="#20303c"/>
  <ellipse cx="640" cy="480" rx="420" ry="130" fill="#1b2934"/>

  <!-- Tree silhouettes -->
  <g fill="#121b25">
    <path d="M90 470 c-20 -70 12 -110 34 -112 c20 0 52 42 32 112 Z"/>
    <path d="M700 465 c-22 -74 10 -116 34 -118 c22 0 56 44 36 118 Z"/>
    <circle cx="112" cy="352" r="26" fill="#121b25"/>
    <circle cx="734" cy="346" r="28" fill="#121b25"/>
  </g>

  <!-- House body -->
  <rect x="250" y="360" width="300" height="130" fill="url(#houseBody)"/>
  <!-- Side wing -->
  <rect x="250" y="380" width="60" height="110" fill="#13181f"/>

  <!-- Roof -->
  <path d="M225 360 L400 290 L575 360 Z" fill="#2a3038"/>
  <path d="M470 314 L575 360 L575 318 L482 272 Z" fill="#1f252c"/>

  <!-- Warm glowing windows -->
  <g fill="#ffd98f">
    <rect x="290" y="400" width="52" height="42" rx="2"/>
    <rect x="365" y="400" width="52" height="42" rx="2"/>
    <rect x="440" y="392" width="60" height="46" rx="2"/>
    <rect x="330" y="440" width="18" height="50"/>
    <rect x="375" y="440" width="18" height="50"/>
  </g>
  <g fill="#f4bd6a" opacity="0.7">
    <rect x="298" y="408" width="36" height="26"/>
    <rect x="448" y="400" width="44" height="30"/>
  </g>

  <!-- Front door -->
  <rect x="270" y="440" width="28" height="50" rx="2" fill="#10151c"/>

  <!-- Grass / lawn -->
  <rect y="490" width="800" height="110" fill="url(#grass)"/>
  <path d="M0 492 L800 470 L800 494 L0 496 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Path -->
  <path d="M400 540 L340 490 L360 490 L430 540 Z" fill="#2a333c"/>
</svg>
