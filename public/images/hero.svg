<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dusk city skyline over the water">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1c"/>
      <stop offset="40%" stop-color="#18213a"/>
      <stop offset="72%" stop-color="#2e2c4a"/>
      <stop offset="88%" stop-color="#6e4a52"/>
      <stop offset="100%" stop-color="#c2855a"/>
    </linearGradient>
    <linearGradient id="backBuildings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20253c"/>
      <stop offset="100%" stop-color="#14182b"/>
    </linearGradient>
    <linearGradient id="frontBuildings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111422"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2135"/>
      <stop offset="100%" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe9c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="180" cy="120" r="2"/>
    <circle cx="420" cy="210" r="1.5"/>
    <circle cx="700" cy="90" r="2"/>
    <circle cx="980" cy="180" r="1.5"/>
    <circle cx="1230" cy="110" r="2.5"/>
    <circle cx="1560" cy="240" r="1.5"/>
    <circle cx="1760" cy="140" r="2"/>
    <circle cx="320" cy="300" r="1.5"/>
    <circle cx="900" cy="330" r="1.5"/>
    <circle cx="1320" cy="320" r="2"/>
  </g>

  <!-- Moon -->
  <circle cx="1440" cy="210" r="270" fill="url(#moonGlow)"/>
  <circle cx="1440" cy="210" r="64" fill="#ffe3b0" opacity="0.95"/>

  <!-- Soft drifting clouds -->
  <ellipse cx="520" cy="430" rx="260" ry="22" fill="#3a3f5c" opacity="0.35"/>
  <ellipse cx="980" cy="470" rx="320" ry="20" fill="#463a5a" opacity="0.3"/>

  <!-- Distant skyline -->
  <g fill="url(#backBuildings)">
    <rect x="0" y="760" width="80" height="150"/>
    <rect x="70" y="700" width="110" height="210"/>
    <rect x="180" y="780" width="90" height="130"/>
    <rect x="300" y="640" width="120" height="270"/>
    <rect x="420" y="720" width="100" height="190"/>
    <rect x="520" y="680" width="140" height="230"/>
    <rect x="680" y="760" width="90" height="150"/>
    <rect x="790" y="700" width="110" height="210"/>
    <rect x="920" y="620" width="130" height="290"/>
    <rect x="1050" y="740" width="110" height="170"/>
    <rect x="1180" y="680" width="120" height="230"/>
    <rect x="1310" y="760" width="100" height="150"/>
    <rect x="1430" y="640" width="120" height="270"/>
    <rect x="1560" y="720" width="110" height="190"/>
    <rect x="1680" y="700" width="110" height="210"/>
    <rect x="1810" y="760" width="110" height="150"/>
  </g>

  <!-- Foreground skyline -->
  <g fill="url(#frontBuildings)">
    <rect x="40" y="780" width="120" height="140"/>
    <rect x="190" y="700" width="150" height="220"/>
    <rect x="360" y="820" width="110" height="100"/>
    <rect x="490" y="740" width="130" height="180"/>
    <rect x="650" y="660" width="110" height="260"/>
    <rect x="780" y="800" width="150" height="120"/>
    <rect x="950" y="720" width="140" height="200"/>
    <rect x="1120" y="780" width="110" height="140"/>
    <rect x="1250" y="680" width="150" height="240"/>
    <rect x="1420" y="790" width="120" height="130"/>
    <rect x="1560" y="740" width="140" height="180"/>
    <rect x="1720" y="700" width="200" height="220"/>
  </g>

  <!-- Water + shimmer -->
  <rect y="900" width="1920" height="180" fill="url(#water)"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.08">
    <line x1="60" y1="930" x2="220" y2="930"/>
    <line x1="420" y1="960" x2="560" y2="960"/>
    <line x1="700" y1="930" x2="880" y2="930"/>
    <line x1="1040" y1="970" x2="1180" y2="970"/>
    <line x1="1300" y1="940" x2="1480" y2="940"/>
    <line x1="1600" y1="980" x2="1760" y2="980"/>
  </g>

  <!-- Shoreline edge -->
  <rect y="898" width="1920" height="4" fill="#0a0d18"/>
</svg>
