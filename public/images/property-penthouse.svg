<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Modern glass skyscraper at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131a2e"/>
      <stop offset="60%" stop-color="#23304f"/>
      <stop offset="100%" stop-color="#7a5c5a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28334d"/>
      <stop offset="55%" stop-color="#3a4a6b"/>
      <stop offset="100%" stop-color="#465a80"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141f"/>
      <stop offset="100%" stop-color="#0b0e18"/>
    </linearGradient>
    <pattern id="winDark" width="34" height="44" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="13" height="22" fill="#1c2537"/>
    </pattern>
    <pattern id="winLit" width="34" height="44" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="13" height="22" fill="#f6d9a0" opacity="0.85"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="640" cy="120" r="42" fill="#ffe3b0" opacity="0.92"/>

  <!-- Distant skyline -->
  <g fill="#141a2c" opacity="0.75">
    <rect x="0" y="360" width="70" height="240"/>
    <rect x="60" y="320" width="90" height="280"/>
    <rect x="170" y="380" width="80" height="220"/>
    <rect x="660" y="360" width="90" height="240"/>
    <rect x="740" y="320" width="60" height="280"/>
  </g>

  <!-- Main tower -->
  <rect x="300" y="70" width="200" height="530" fill="url(#tower)"/>
  <!-- Tower edge highlights -->
  <rect x="300" y="70" width="6" height="530" fill="#ffffff" opacity="0.18"/>
  <rect x="494" y="70" width="6" height="530" fill="#0e1422" opacity="0.5"/>
  <!-- Window bands (dark + warm lit) -->
  <rect x="312" y="90" width="176" height="480" fill="url(#winDark)"/>
  <rect x="312" y="90" width="176" height="200" fill="url(#winLit)"/>
  <rect x="312" y="340" width="88" height="120" fill="url(#winLit)" opacity="0.8"/>

  <!-- Street + cars glow -->
  <rect y="560" width="800" height="40" fill="url(#street)"/>
  <g fill="#f6d9a0" opacity="0.5">
    <rect x="120" y="568" width="40" height="3" rx="1.5"/>
    <rect x="360" y="572" width="34" height="3" rx="1.5"/>
    <rect x="520" y="566" width="46" height="3" rx="1.5"/>
  </g>
  <rect y="596" width="800" height="4" fill="#080a12"/>
</svg>
