<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Luxury apartment interior with large window">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe9df"/>
      <stop offset="100%" stop-color="#e2d8c8"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31415c"/>
      <stop offset="70%" stop-color="#5d5a70"/>
      <stop offset="100%" stop-color="#c98a63"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa37c"/>
      <stop offset="100%" stop-color="#a97f5c"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#26262c"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="800" height="600" fill="url(#wall)"/>

  <!-- Large arched window with dusk city view -->
  <g>
    <rect x="130" y="60" width="540" height="360" fill="#1a2230"/>
    <rect x="130" y="60" width="540" height="360" fill="url(#windowSky)"/>
    <!-- distant skyline through the window -->
    <g fill="#20263a" opacity="0.8">
      <rect x="150" y="300" width="60" height="120"/>
      <rect x="220" y="260" width="50" height="160"/>
      <rect x="290" y="320" width="60" height="100"/>
      <rect x="430" y="280" width="60" height="140"/>
      <rect x="500" y="240" width="55" height="180"/>
      <rect x="570" y="300" width="80" height="120"/>
    </g>
    <!-- window frame -->
    <rect x="128" y="58" width="544" height="364" rx="10" fill="none" stroke="#caa57a" stroke-width="10"/>
    <line x1="400" y1="58" x2="400" y2="422" stroke="#caa57a" stroke-width="8"/>
    <line x1="130" y1="240" x2="670" y2="240" stroke="#caa57a" stroke-width="8"/>
    <!-- window sill -->
    <rect x="112" y="418" width="576" height="14" rx="4" fill="#b98d62"/>
  </g>

  <!-- Curtain -->
  <path d="M118 52 q40 20 8 70 l-10 300 h-30 v-370 Z" fill="#b98d62" opacity="0.9"/>
  <path d="M682 52 q-40 20 -8 70 l10 300 h30 v-370 Z" fill="#b98d62" opacity="0.9"/>

  <!-- Pendant light -->
  <line x1="520" y1="0" x2="520" y2="120" stroke="#b98d62" stroke-width="4"/>
  <path d="M500 120 h40 l-10 26 h-20 Z" fill="#d9b98a"/>
  <rect x="506" y="146" width="28" height="8" rx="4" fill="#ffd98f" opacity="0.9"/>

  <!-- Floor -->
  <rect y="432" width="800" height="168" fill="url(#floor)"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.15">
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="548" x2="800" y2="548"/>
  </g>

  <!-- Sofa -->
  <g>
    <rect x="170" y="440" width="460" height="110" rx="16" fill="url(#sofa)"/>
    <!-- backrest -->
    <rect x="180" y="398" width="440" height="80" rx="18" fill="#303038"/>
    <!-- armrests -->
    <rect x="150" y="420" width="60" height="130" rx="16" fill="#232329"/>
    <rect x="590" y="420" width="60" height="130" rx="16" fill="#232329"/>
    <!-- cushions -->
    <rect x="230" y="446" width="150" height="92" rx="12" fill="#4a4a54"/>
    <rect x="400" y="446" width="150" height="92" rx="12" fill="#4a4a54"/>
    <!-- throw pillow -->
    <rect x="500" y="408" width="46" height="46" rx="8" fill="#c8a15a"/>
  </g>

  <!-- Round coffee table -->
  <rect x="380" y="556" width="120" height="10" rx="5" fill="#8a623f"/>
  <rect x="432" y="560" width="16" height="34" fill="#7a5434"/>

  <!-- Plant in the corner -->
  <g>
    <rect x="655" y="480" width="46" height="56" rx="6" fill="#b98d62"/>
    <path d="M678 482 C 650 430 618 448 614 478 C 640 470 668 478 678 492 Z" fill="#3f7d5a"/>
    <path d="M678 482 C 700 428 738 446 742 478 C 714 470 688 478 678 492 Z" fill="#4c9068"/>
    <path d="M678 478 C 672 430 690 410 706 428 C 692 448 690 468 678 486 Z" fill="#35694c"/>
  </g>
</svg>
